[package]
name = "hash-checker"
version = "0.1.0"
edition = "2021"

[dependencies]
eframe = "0.29"
egui = "0.29"
crc32fast = "1.4"
md5 = "0.7"
sha1 = "0.10"
sha2 = "0.10"
walkdir = "2"
clap = { version = "4.5", features = ["derive"] }
tokio = { version = "1.40", features = ["full"] }
rfd = "0.15"
image = "0.25"
winreg = { version = "0.11", cfg = 'target_os = "windows"' }
zip = "0.6"
sevenz-rust = { version = "0.3", features = ["bzip2", "zstd"] }
flate2 = "1.0"
crossbeam-channel = "0.5"

[profile.release]
opt-level = 3
lto = true
strip = true
codegen-units = 1
panic = "abort"

[build-dependencies]
embed-resource = "3.0.12"
winres = "0.1.12"
